# Netlify publica la carpeta "site". No hace falta compilar nada.
[build]
  publish = "site"
  command = ""
  # Solo publica cuando cambia la web (carpeta site/). Así los cambios en scripts,
  # config o el robot no gastan créditos de Netlify.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- site/ netlify.toml"

[[headers]]
  for = "/data.json"
  [headers.values]
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
