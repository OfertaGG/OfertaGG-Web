# Robot de OfertaGG: se ejecuta solo en GitHub, gratis.
#  - SOLO una vez por semana: cada lunes a las 6:00 (hora de España), revisión completa
#    de todo el catálogo y de los precios de las tiendas (Steam, Kinguin, Loaded...).
#  - Además genera una página por juego para Google (scripts/seo_pages.py).
#  - También se puede lanzar a mano con el botón "Run workflow" (en Cloudflare Pages es gratis).
# Después guarda los cambios en GitHub y Cloudflare Pages publica la web nueva automáticamente.
name: Actualizar ofertas

on:
  schedule:
    - cron: "0 4 * * 1"   # lunes, completo (UTC)
  workflow_dispatch:       # botón "Run workflow" para lanzarlo a mano
    inputs:
      modo:
        description: "completo o diario"
        default: "completo"

permissions:
  contents: write

concurrency:
  group: actualizar-ofertas
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow

      - name: Elegir modo
        id: modo
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then M="${{ github.event.inputs.modo }}";
          elif [ "${{ github.event.schedule }}" = "0 4 * * 1" ]; then M="completo";
          else M="diario"; fi
          echo "modo=$M" >> "$GITHUB_OUTPUT"; echo "Modo: $M"

      # Solo mientras no haya feeds reales: renueva los precios de ejemplo cada lunes
      - name: Precios de ejemplo (demo)
        if: steps.modo.outputs.modo == 'completo' && hashFiles('feeds/demo.json') != ''
        run: python scripts/demo_feeds.py --novedades

      # Feeds reales de los afiliados (si uno falla, la web se actualiza igual con los demás)
      - name: Feed de Kinguin
        continue-on-error: true
        run: python scripts/feeds/kinguin.py
        env:
          KINGUIN_FEED_URL: ${{ secrets.KINGUIN_FEED_URL }}
          KINGUIN_REF: ${{ secrets.KINGUIN_REF }}

      - name: Catálogo de Loaded (Impact)
        continue-on-error: true
        run: python scripts/feeds/loaded.py
        env:
          IMPACT_SID: ${{ secrets.IMPACT_SID }}
          IMPACT_TOKEN: ${{ secrets.IMPACT_TOKEN }}

      - name: Actualizar juegos y ofertas
        run: |
          if [ "${{ steps.modo.outputs.modo }}" = "diario" ]; then python scripts/update.py --diario; else python scripts/update.py; fi

      # Junta src/ (diseño) en site/index.html: así los cambios de diseño salen en el mismo deploy que los precios
      - name: Montar la web
        run: python scripts/build_page.py && rm -f preview.html

      # Páginas que Google puede leer: una por juego, listas y sitemap (salen en la misma publicación)
      - name: Páginas SEO
        continue-on-error: true   # si fallara, los precios se guardan igual
        run: python scripts/seo_pages.py

      - name: Guardar cambios
        run: |
          git config user.name "OfertaGG bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A site config
          git add -A feeds 2>/dev/null || true   # feeds/ puede estar vacía
          git diff --cached --quiet && echo "Sin cambios" || (git commit -m "Ofertas actualizadas ($(date -u +%F), ${{ steps.modo.outputs.modo }})" && git push)
